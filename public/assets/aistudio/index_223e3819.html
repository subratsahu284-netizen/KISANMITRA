/section>\n\n <section class=\"card\">\n  <div class=\"ch\"><h2><span class=\"n\" style=\"background:var(--pink)\">2<\/span>Crop &amp; growth stage<\/h2><\/div>\n  <label class=\"l\" style=\"margin-top:0\">Crop variety<\/label>\n  <select><option>\ud83c\udf45 Tomato (Hybrid Shivam)<\/option><option>\ud83c\udf45 Tomato (Local)<\/option><option>\ud83e\udd54 Potato<\/option><option>\ud83c\udf36\ufe0f Chilli<\/option><\/select>\n  <label class=\"l\">Current growth stage<\/label>\n  <div class=\"stages\" id=\"stages\"><\/div>\n  <div class=\"row\"><label class=\"l\">What have you noticed? (optional)<\/label><button class=\"sp\" id=\"sp\">\ud83c\udf99\ufe0f Speak<\/button><\/div>\n  <textarea id=\"ta\" placeholder=\"e.g. Rings on lower leaves, yellow edges, spots on fruit, or curling leaves\u2026\"><\/textarea>\n  <button class=\"run\" id=\"run\">\u2728 Run AI disease diagnosis<\/button>\n <\/section>\n<\/div>\n\n<section class=\"res card\" id=\"res\" style=\"max-width:none\">\n <h3 id=\"rh\"><\/h3><div id=\"rs\" style=\"color:var(--mute)\"><\/div>\n <div class=\"conf\"><b id=\"rc\" class=\"d\"><\/b><div class=\"meter\"><i id=\"rm\"><\/i><\/div><\/div>\n <ul id=\"rl\"><\/ul>\n <p class=\"fine\">\u26a0\ufe0f Advisory only. Symptoms can overlap with stress or nutrient problems, so confirm with your local Krishi Vigyan Kendra (KVK) before you buy or spray chemicals.<\/p>\n<\/section>\n<\/div>\n\n<button class=\"voice\" id=\"voice\"><i>\ud83c\udf99\ufe0f<\/i><span>Voice assistant<small>AI voice copilot<\/small><\/span><\/button>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst L=[\n{n:'Early Blight',e:'\ud83c\udf42',g:'#3f8f3a',s:'#3b1d0c',h:'#e6c229',cap:'<b>Fungal spot:<\/b> Dark brown to black spots with target-board rings and a yellow halo. Older lower leaves show symptoms first.',c:86,sev:'Moderate to severe',acts:['\u2702\ufe0f|Remove infected lower leaves and bag them. Do not compost.','\ud83d\udca7|Water at the base in the morning. Keep leaves dry.','\ud83c\udf2c\ufe0f|Stake plants and widen spacing for airflow.','\ud83e\uddd1\u200d\ud83c\udf3e|Ask your KVK which fungicide suits your stage.']},\n{n:'Healthy leaf',e:'\u2705',g:'#4fb04a',s:null,h:null,cap:'<b>Looks healthy:<\/b> Even green colour, firm leaf and no spots or curling.',c:93,sev:'No disease found',acts:['\ud83d\udc40|Keep scouting twice a week, especially after rain.','\ud83d\udca6|Water steadily and avoid wet leaves at night.','\ud83e\uddea|Do a soil test before adding extra fertilizer.']},\n{n:'Leaf curl',e:'\ud83c\udf00',g:'#6aa03a',s:null,h:null,cap:'<b>Curling:<\/b> Leaves roll upward and look thick and small. Whiteflies often spread this virus.',c:74,sev:'Moderate',acts:['\ud83e\udeb0|Check the underside of leaves for whiteflies.','\ud83d\udfe1|Place yellow sticky traps around the plot.','\ud83c\udf31|Pull out badly affected plants to protect the rest.','\ud83e\uddd1\u200d\ud83c\udf3e|Ask your KVK about safe whitefly control.']},\n{n:'Septoria spot',e:'\u26ab',g:'#46963f',s:'#e8e1c8',h:null,cap:'<b>Small spots:<\/b> Many tiny round spots with grey centres and dark edges, starting on the lower leaves.',c:79,sev:'Moderate',acts:['\u2702\ufe0f|Remove spotted lower leaves early.','\ud83d\udebf|Avoid overhead watering and working in wet fields.','\ud83d\udd04|Rotate crops next season.']},\n{n:'Yellowing',e:'\ud83d\udc9b',g:'#b8c83a',s:null,h:'#e6d84a',cap:'<b>Yellow leaves:<\/b> Pale or yellow leaves can mean a nutrient gap, too much water, or root trouble.',c:62,sev:'Check cause first',acts:['\ud83e\uddea|Get a soil test to check nitrogen and magnesium.','\ud83d\udca6|Check drainage. Waterlogged roots turn leaves yellow.','\ud83d\udd0e|Look at roots and stem base for rot.']}];\nconst ST=[['\ud83c\udf31','Seedling / nursery','#7ee08a'],['\ud83c\udf3f','Vegetative growth','#3fc97a'],['\ud83c\udf38','Flowering stage','#ff7ab8'],['\ud83c\udf45','Fruit development','#ff7a59'],['\ud83e\uddfa','Harvesting stage','#ffc533']];\nlet cur=0,stage=2,custom=null;\nfunction leaf(x,w){const sp=x.s?[[150,140,20],[230,200,14],[120,230,12],[200,110,9],[260,140,11]].map(([a,b,r])=>`<g class=\"spot\" style=\"transform-origin:${a}px ${b}px\"><circle cx=\"${a}\" cy=\"${b}\" r=\"${r*(x.h?1.9:1.3)}\" fill=\"${x.h||'none'}\" opacity=\".7\"/><circle cx=\"${a}\" cy=\"${b}\" r=\"${r}\" fill=\"${x.s}\"/><circle cx=\"${a}\" cy=\"${b}\" r=\"${r*.55}\" fill=\"none\" stroke=\"#00000066\" stroke-width=\"2\"/><\/g>`).join(''):x.h?`<ellipse cx=\"200\" cy=\"170\" rx=\"90\" ry=\"60\" fill=\"${x.h}\" opacity=\".6\"/>`:'';\nconst rot=x.n==='Leaf curl'?'<path d=\"M60 170Q200 60 340 170Q200 130 60 170Z\" fill=\"#00000030\"/>':'';\nreturn `<svg viewBox=\"0 0 400 340\" ${w?'':'preserveAspectRatio=\"xMidYMid slice\"'}><path d=\"M200 320V190\" stroke=\"#2f7a2c\" stroke-width=\"10\"/><path d=\"M200 300C60 280 30 150 120 70C170 30 260 30 300 80C370 160 320 290 200 300Z\" fill=\"${x.g}\"/><path d=\"M200 295V70M200 230L130 180M200 200L270 150M200 160L140 120\" stroke=\"rgba(11,122,69,0.373)\" stroke-width=\"3\" fill=\"none\"/>${sp}${rot}<\/svg>`}\nfunction show(i){cur=i;const x=L[i];custom=null;$('art').innerHTML=leaf(x);$('chip').textContent='Sample: Tomato leaf \u00b7 '+x.n;$('cap').innerHTML=x.cap;$('cap').style.display='';\n document.querySelectorAll('.th').forEach((t,j)=>t.classList.toggle('on',j===i));$('res').classList.remove('show')}\nL.forEach((x,i)=>{const b=document.createElement('button');b.className='th';b.innerHTML=leaf(x,1)+`<span>${x.e} ${x.n}<\/span>`;b.onclick=()=>show(i);$('thumbs').appendChild(b)});\nST.forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.style.setProperty('--c',s[2]);b.innerHTML=`<span>${s[0]}<\/span>${s[1]}`;b.onclick=()=>{stage=i;document.querySelectorAll('.st').forEach((t,j)=>t.classList.toggle('on',j===i))};$('stages').appendChild(b)});\ndocument.querySelectorAll('.st')[2].classList.add('on');show(0);\n$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{custom=true;$('art').innerHTML=`<img src=\"${r.result}\" alt=\"Your leaf photo\">`;$('chip').textContent='Your photo: '+f.name;$('cap').style.display='none';document.querySelectorAll('.th').forEach(t=>t.classList.remove('on'));$('res').classList.remove('show')};r.readAsDataURL(f)};\n$('run').onclick=()=>{const b=$('run');b.disabled=true;b.textContent='\ud83d\udd0d Scanning your leaf\u2026';$('view').classList.add('busy');$('res').classList.remove('show');\n setTimeout(()=>{$('view').classList.remove('busy');b.disabled=false;b.textContent='\u2728 Run AI disease diagnosis';const x=custom?L[0]:L[cur];\n  $('rh').textContent=(custom?'Likely: ':'')+x.e+' '+x.n;$('rs').textContent=x.sev+' \u00b7 Stage: '+ST[stage][1]+(custom?' \u00b7 Demo result for your photo':'');\n  $('rc').textContent=x.c+'% match';$('rl').innerHTML=x.acts.map((a,i)=>{const[e,t]=a.split('|');return`<li style=\"animation-delay:${i*.2}s\"><span>${e}<\/span><span>${t}<\/span><\/li>`}).join('');\n  $('res').classList.add('show');$('rm').style.width='0';setTimeout(()=>$('rm').style.width=x.c+'%',60);$('res').scrollIntoView({behavior:'smooth',block:'nearest'})},2200)};\nlet rec=0;$('sp').onclick=()=>{rec=!rec;$('sp').classList.toggle('rec',rec);$('sp').textContent=rec?'\u23f9 Listening\u2026':'\ud83c\udf99\ufe0f Speak';\n if(rec)setTimeout(()=>{if(rec){$('sp').click();$('ta').value='Brown rings on the lower leaves with yellow edges.'}},2500)};\nfunction toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}\n$('voice').onclick=()=>parent.postMessage({go:'voice'},'*');\ndocument.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on')});\n<\/script>\n<\/body>\n<\/html>\n", "weather": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>KisanMitra AI \u2013 Crop Risk Dashboard<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3faf5;--bg2:#103d2c;--ink:#12392a;--mute:#5a7a69;--lime:#2fbf71;--sun:#ffc533;--red:#e5484d;--sky:#0b8fc2;--pink:#ff7ab8;--card:#ffffff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box;margin:0}\nhtml{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;\nbackground-image:radial-gradient(900px 500px at 10% -10%,#1d7a4a55,transparent),radial-gradient(700px 500px at 100% 20%,#38c6ff22,transparent),radial-gradient(600px 400px at 50% 100%,#ffc53322,transparent)}\nh1,h2,h3,.disp{font-family:'Baloo 2',sans-serif}\n.wrap{max-width:1180px;margin:auto;padding:14px 16px 110px}\nnav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;align-items:center}\n.logo{display:flex;align-items:center;gap:10px;margin-right:10px;flex:none}\n.logo i{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--lime),#19b36b);display:grid;place-items:center;font-style:normal;font-size:22px;animation:sway 4s ease-in-out infinite}\n.logo b{font:800 22px 'Baloo 2';line-height:1}.logo small{display:block;color:var(--mute);font-size:11px}\n@keyframes sway{50%{transform:rotate(-9deg) scale(1.06)}}\n.tab{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;border:1px solid rgba(11,122,69,0.110);cursor:pointer;transition:.2s}\n.tab:hover{transform:translateY(-2px);background:rgba(11,122,69,0.132)}\n.tab.on{background:linear-gradient(90deg,#19b36b,var(--lime));color:#06210f;border:0}\n.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px;background:linear-gradient(135deg,#0f4a33,#0b2a1f 60%,#2b1f0b);border:1px solid rgba(11,122,69,0.143);box-shadow:0 20px 60px #0e7a4a44}\n.hero::before,.hero::after{content:\"\";position:absolute;border-radius:50%;filter:blur(50px);opacity:.5;animation:float 9s ease-in-out infinite}\n.hero::before{width:260px;height:260px;background:#19b36b;right:-60px;top:-80px}\n.hero::after{width:220px;height:220px;background:var(--sun);left:30%;bottom:-120px;animation-delay:-4s;opacity:.3}\n@keyframes float{50%{transform:translate(-30px,20px) scale(1.15)}}\n.top{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}\n.badge{display:inline-block;background:var(--sun);color:#3a2700;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;margin-bottom:10px}\n.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.05}\n.hero h1 span{color:var(--lime)}\n.where{color:var(--sky);font-weight:700;margin-top:6px}\n.gauge{position:relative;width:150px;height:150px;flex:none}\n.gauge svg{transform:rotate(-90deg)}\n.gauge .ring{stroke-dasharray:408;stroke-dashoffset:408;animation:fill 2s .3s cubic-bezier(.2,.8,.2,1) forwards}\n@keyframes fill{to{stroke-dashoffset:90}}\n.gauge div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}\n.gauge b{font:800 40px 'Baloo 2';line-height:1;color:var(--red)}\n.gauge small{font-weight:700;color:#c92a2a}\n.gauge::after{content:\"\";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ping 2s 2s infinite}\n@keyframes ping{0%{opacity:.7;transform:scale(.95)}100%{opacity:0;transform:scale(1.2)}}\n.cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:24px}\n.c{border-radius:22px;padding:18px;background:var(--card);border:1px solid rgba(11,122,69,0.132);border-top:5px solid var(--a);backdrop-filter:blur(6px);transition:.25s;animation:rise .7s both}\n.c:nth-child(2){animation-delay:.15s}.c:nth-child(3){animation-delay:.3s}\n@keyframes rise{from{opacity:0;transform:translateY(24px)}}\n.c:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 14px 34px -10px var(--a)}\n.c header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}\n.c h3{font-size:18px;display:flex;gap:8px;align-items:center}\n.ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--a);font-size:18px}\n.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--a) 25%,transparent);color:var(--a);white-space:nowrap}\n.c p{font-size:14.5px;line-height:1.5;color:#254a37}\n.c a{display:inline-block;margin-top:12px;font-weight:800;color:var(--a);text-decoration:none;font-size:14px;cursor:pointer}\n.c a:hover{text-decoration:underline}\n.stop{animation:blink 1.4s infinite}\n@keyframes blink{50%{background:#e5484d55}}\n.note{position:relative;z-index:1;margin-top:18px;display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:#ffc53318;border:1px dashed #ffc53388;font-size:13px;line-height:1.5;color:#7a4f00}\n.note span{font-size:22px;animation:sway 2.5s infinite}\n.sec{margin-top:26px;border-radius:28px;padding:24px;background:linear-gradient(160deg,#12394a,#0b2a1f);border:1px solid rgba(11,122,69,0.132);position:relative;overflow:hidden}\n.sec h2{font-size:30px}.sec>p{color:var(--mute);margin:4px 0 16px;max-width:60ch}\n.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}\n.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid rgba(11,122,69,0.264);background:transparent;color:var(--ink);font:700 14px Nunito;cursor:pointer;transition:.2s}\n.chip.on{background:linear-gradient(90deg,var(--sky),#6ee7b7);color:#052a2e;border:0;transform:scale(1.06)}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}\n.st{padding:14px;border-radius:18px;background:rgba(11,122,69,0.071);text-align:center}\n.st em{font-style:normal;font-size:26px;display:block}\n.st b{font:800 28px 'Baloo 2';display:block;line-height:1.1}\n.st small{color:var(--mute);font-weight:600}\n.strip{display:flex;gap:4px;align-items:flex-end;height:110px;margin-top:8px}\n.bar{flex:1;border-radius:8px 8px 3px 3px;background:var(--c);height:0;animation:grow .9s cubic-bezier(.2,.9,.3,1.2) forwards;position:relative}\n@keyframes grow{to{height:var(--h)}}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px;font-weight:600}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}\n.drop{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(#38c6ff00,#38c6ff);animation:rain linear infinite;opacity:.6}\n@keyframes rain{to{transform:translateY(420px)}}\n.voice{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:10px 18px 10px 10px;border:0;border-radius:999px;background:linear-gradient(90deg,#19b36b,var(--lime));color:#06210f;font:800 15px 'Baloo 2';cursor:pointer;box-shadow:0 10px 30px #19b36b88;z-index:5}\n.voice i{width:42px;height:42px;border-radius:50%;background:#06210f;display:grid;place-items:center;font-style:normal;position:relative}\n.voice i::after{content:\"\";position:absolute;inset:0;border-radius:50%;border:2px solid var(--lime);animation:ping 1.6s infinite}\n.voice small{display:block;font:700 11px Nunito;opacity:.8}\n.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#fff;color:#06210f;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;z-index:6;pointer-events:none}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}\n\n/* ===== Light theme: green & white ===== */\nhtml{color-scheme:light}\nbody{background:#f3faf5;background-image:radial-gradient(800px 480px at 8% -8%,#c8f0d9cc,transparent),radial-gradient(700px 460px at 100% 18%,#d9f3e4aa,transparent),radial-gradient(600px 400px at 50% 100%,#fff6d488,transparent)}\n:focus-visible{outline:3px solid #0e9f5c;outline-offset:2px}\n.card,.panel{background:#fff;border:1px solid #d3eadb;box-shadow:0 12px 32px -18px #0e7a4a66}\n.hero,.intro,.head,.sec,.res{background:linear-gradient(135deg,#e3f7ea,#fff 78%);border:1px solid #cfe8d8;color:var(--ink);box-shadow:0 14px 36px -20px #0e7a4a77}\n.head p,.intro p,.hero p{color:#4a6b59}\n.pill{background:#d6f3e2;color:#0b7a45}\n.hero h1 span{color:#0b8a4d}\n.sub,.ct h3{color:#a65f00}\n.adv{background:linear-gradient(135deg,#0e9f5c,#14b86a);border:0;color:#fff}\n.adv .h,.adv p{color:#fff}\n.x{background:#e3f3e9;color:var(--ink)}.x:hover{background:var(--red);color:#fff}\n.sw{background:#cfe3d6}.sw::after{box-shadow:0 1px 3px #0003}.sw.on{background:linear-gradient(90deg,#0e9f5c,#2fbf71)}\n.view{background:radial-gradient(circle at 50% 40%,#f1fbf5,#bfe6cd);border-color:#cfe8d8}\n.view .chip,.view .cap{color:#fff}\n.tag,.b{color:color-mix(in srgb,var(--a,var(--c,#0b7a45)) 55%,#000)}\n.c a,.m small{color:color-mix(in srgb,var(--a,var(--c)) 55%,#000)}\n.voice{background:linear-gradient(90deg,#0e9f5c,#2fbf71);color:#fff;box-shadow:0 10px 26px -6px #0e9f5c99}\n.voice i{background:#fff}.voice i::after{border-color:#2fbf71}\n.sp{background:#e3f3e9;color:#0b7a45}\nselect,textarea,input[type=text],input[type=tel],input[type=number]{background:#fff;border:1.5px solid #cfe3d6;color:var(--ink)}\n.chart{background:#f7fcf9;border:1px solid #d3eadb}\n.tip{background:#12392a;color:#fff;box-shadow:0 6px 16px #0003}\n.toast{background:#12392a;color:#fff}\n.ticker,.mic-box{background:#fff;border:1px solid #d3eadb}\n.intro .chips .chip{background:#fff;color:var(--ink)}\n.intro .chips .chip.on{background:var(--c);color:#06210f}\n.sms .st{background:#e3f3e9;color:#12392a}\n.adv::before{background:linear-gradient(100deg,transparent 30%,#ffffff44,transparent 70%)}\nnav{display:none!important}<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<nav>\n <div class=\"logo\"><i>\ud83c\udf31<\/i><div><b>KisanMitra<\/b><small>Crop risk decision support<\/small><\/div><\/div>\n <button class=\"tab\">\ud83d\udd2c Crop Diagnosis<\/button><button class=\"tab on\">\u26c5 Weather &amp; Spray<\/button><button class=\"tab\">\ud83d\udcc8 Mandi Prices<\/button><button class=\"tab\">\ud83e\uddd1\u200d\ud83c\udf3e Agri-Experts<\/button><button class=\"tab\">\ud83d\udc64 Farmer Profile<\/button>\n<\/nav>\n\n<section class=\"hero\">\n <div class=\"top\">\n  <div>\n   <span class=\"badge\">\ud83e\udde0 Integrated decision support<\/span>\n   <h1>Tomato (Hybrid Shivam) <span>\u00b7 Flowering<\/span><\/h1>\n   <p class=\"where\">\ud83d\udccd Sambalpur, Odisha<\/p>\n  <\/div>\n  <div class=\"gauge\">\n   <svg width=\"150\" height=\"150\" viewBox=\"0 0 150 150\"><circle cx=\"75\" cy=\"75\" r=\"65\" fill=\"none\" stroke=\"rgba(11,122,69,0.132)\" stroke-width=\"14\"/>\n   <defs><linearGradient id=\"g\"><stop offset=\"0\" stop-color=\"#ffc533\"/><stop offset=\"1\" stop-color=\"#e5484d\"/><\/linearGradient><\/defs>\n   <circle class=\"ring\" cx=\"75\" cy=\"75\" r=\"65\" fill=\"none\" stroke=\"url(#g)\" stroke-width=\"14\" stroke-linecap=\"round\"/><\/svg>\n   <div><b id=\"num\">0<\/b><small>Severe risk<\/small><\/div>\n  <\/div>\n <\/div>\n\n <div class=\"cards\">\n  <article class=\"c\" style=\"--a:#ff9f43\">\n   <header><h3><span class=\"ic\">\ud83c\udf42<\/span>Crop protection<\/h3><span class=\"tag\">Active symptoms<\/span><\/header>\n   <p>Prune lower leaves infected with Early Blight and isolate the foliage to limit spore spread.<\/p>\n   <a data-t=\"Opening diagnosis report\u2026\" data-go=\"diagnosis\">View full diagnosis report \u2192<\/a>\n  <\/article>\n  <article class=\"c\" style=\"--a:#e5484d\">\n   <header><h3><span class=\"ic\">\ud83d\udeab<\/span>Spray window<\/h3><span class=\"tag stop\">Do not spray<\/span><\/header>\n   <p>High humidity (78%) raises fungal spore risk. Weather is borderline, so check wind gusts and cloud cover before you apply.<\/p>\n   <a data-t=\"Jumping to 48-hr forecast\u2026\" href=\"#weather\">View 48-hr spray &amp; rain forecast \u2192<\/a>\n  <\/article>\n  <article class=\"c\" style=\"--a:#38c6ff\">\n   <header><h3><span class=\"ic\">\ud83e\uddfa<\/span>Mandi &amp; harvest<\/h3><span class=\"tag\">Hold 3\u20135 days<\/span><\/header>\n   <p>The crop hasn't reached maturity. Keep up agronomic care until fruit is ready to pick.<\/p>\n   <a data-t=\"Fetching live mandi rates\u2026\" data-go=\"mandi\">Check live mandi rates (\u20b92450/Q) \u2192<\/a>\n  <\/article>\n <\/div>\n <div class=\"note\"><span>\u26a0\ufe0f<\/span><div><b>Key guidance:<\/b> AI diagnosis is advisory, based on visible symptoms. Disease signs can look like stress or nutrient deficiency. Confirm with your local Krishi Vigyan Kendra (KVK) or extension specialist before buying or applying chemicals.<\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"weather\">\n <div id=\"rain\"><\/div>\n <h2>\ud83c\udf26\ufe0f Weather &amp; field advisory<\/h2>\n <p>Check blight risk, safe spraying windows, and the best days to plant or harvest in your district.<\/p>\n <div class=\"chips\" id=\"chips\"><\/div>\n <div class=\"stats\">\n  <div class=\"st\"><em>\ud83d\udca7<\/em><b id=\"hum\">78%<\/b><small>Humidity<\/small><\/div>\n  <div class=\"st\"><em>\ud83c\udf21\ufe0f<\/em><b id=\"tmp\">29\u00b0C<\/b><small>Temperature<\/small><\/div>\n  <div class=\"st\"><em>\ud83d\udca8<\/em><b id=\"wnd\">14 km/h<\/b><small>Wind<\/small><\/div>\n  <div class=\"st\"><em>\u2614<\/em><b id=\"rn\">40%<\/b><small>Rain chance<\/small><\/div>\n <\/div>\n <b>Next 24 hours: spray safety<\/b>\n <div class=\"strip\" id=\"strip\"><\/div>\n <div class=\"legend\"><span><i style=\"background:#12a150\"><\/i>Safe<\/span><span><i style=\"background:#ffc533\"><\/i>Borderline<\/span><span><i style=\"background:#e5484d\"><\/i>Don't spray<\/span><\/div>\n<\/section>\n<\/div>\n\n<button class=\"voice\" id=\"voice\"><i>\ud83c\udf99\ufe0f<\/i><span>Voice assistant<small>AI voice copilot<\/small><\/span><\/button>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nconst D={Sambalpur:[78,29,14,40],Nashik:[54,31,9,10],Warangal:[62,34,18,20],Karnal:[48,27,22,5]};\nconst $=id=>document.getElementById(id);\nfunction toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}\n// count-up risk score\nlet n=0;const iv=setInterval(()=>{n+=2;$('num').textContent=Math.min(n,78);if(n>=78)clearInterval(iv)},50);\n// strip of hourly safety\nfunction strip(h,w,r){const s=$('strip');s.innerHTML='';\n for(let i=0;i<24;i++){const wave=Math.sin(i/3.5)*12,hum=h+wave,wind=w+Math.cos(i/2)*6,rain=r+Math.sin(i/2.2)*18;\n  const risk=(hum>75?2:hum>62?1:0)+(wind>20?2:wind>14?1:0)+(rain>35?2:rain>20?1:0);\n  const c=risk>=3?'#e5484d':risk>=1?'#ffc533':'#12a150',hgt=28+Math.min(risk,4)*15+Math.random()*6;\n  const b=document.createElement('div');b.className='bar';b.style.cssText=`--c:${c};--h:${hgt}px;animation-delay:${i*35}ms`;b.title=i+':00';s.appendChild(b)}}\nfunction pick(k){const d=D[k];[ 'hum','tmp','wnd','rn'].forEach((id,i)=>$(id).textContent=d[i]+['%','\u00b0C',' km/h','%'][i]);\n strip(d[0],d[2],d[3]);document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===k))}\nObject.keys(D).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.onclick=()=>pick(k);$('chips').appendChild(b)});\npick('Sambalpur');\n// rain drops\nfor(let i=0;i<22;i++){const d=document.createElement('div');d.className='drop';d.style.cssText=`left:${Math.random()*100}%;animation-duration:${1.2+Math.random()}s;animation-delay:${Math.random()*2}s`;$('rain').appendChild(d)}\ndocument.querySelectorAll('[data-t]').forEach(a=>a.onclick=()=>a.dataset.go?parent.postMessage({go:a.dataset.go},'*'):toast(a.dataset.t));\ndocument.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on')});\n$('voice').onclick=()=>parent.postMessage({go:'voice'},'*');\n<\/script>\n<\/body>\n<\/html>\n", "mandi": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>KisanMitra AI \u2013 Mandi Market Prices<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f3faf5;--ink:#12392a;--mute:#5a7a69;--lime:#2fbf71;--sun:#ffc533;--red:#e5484d;--sky:#0b8fc2;--pink:#ff7ab8;--card:#ffffff;--tr:#12a150;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box;margin:0}\nhtml{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;\nbackground-image:radial-gradient(900px 500px at 0 -10%,#1d7a4a55,transparent),radial-gradient(700px 500px at 100% 30%,#ffc53325,transparent),radial-gradient(600px 400px at 40% 100%,#38c6ff22,transparent)}\nh1,h2,h3{font-family:'Baloo 2',sans-serif}\n.wrap{max-width:1180px;margin:auto;padding:14px 16px 110px}\nnav{display:flex;gap:8px;overflow-x:auto;padding:6px 0 16px;align-items:center}\n.logo{display:flex;align-items:center;gap:10px;margin-right:10px;flex:none}\n.logo i{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--lime),#19b36b);display:grid;place-items:center;font-style:normal;font-size:22px;animation:sway 4s ease-in-out infinite}\n.logo b{font:800 22px 'Baloo 2';line-height:1}.logo small{display:block;color:var(--mute);font-si iv{display:flex;gap:30px;animation:tick 28s linear infinite;padding-left:20px;font-weight:800}\n@keyframes tick{to{transform:translateX(-50%)}}\n.up{color:var(--tr)}.dn{color:var(--red)}\n.main{display:grid;grid-template-columns:1fr 1.45fr;gap:20px}\n@media(max-width:900px){.main{grid-template-columns:1fr}}\n.top{display:flex;justify-content:space-between;color:var(--mute);font-weight:700;font-size:13px;gap:8px}\n.cn{font:800 28px 'Baloo 2';margin-top:10px;line-height:1.15}\n.loc{color:var(--sky);font-weight:700;font-size:14px}\n.rate{margin-top:16px;padding:18px;border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--tr) 28%,transparent),rgba(11,122,69,0.033));border:1px solid color-mix(in srgb,var(--tr) 45%,transparent)}\n.rate small{color:var(--mute);font-weight:700}\n.big{font:800 52px 'Baloo 2';line-height:1.1}\n.big span{font:700 15px Nunito;color:var(--mute)}\n.chg{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:10px;border-top:1px dashed rgba(11,122,69,0.280);font-weight:700;font-size:14px}\n.chg b{padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--tr) 25%,transparent);color:var(--tr);animation:bump 2s infinite}\n@keyframes bump{50%{transform:scale(1.1)}}\n.adv{margin-top:16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#06301f,#0e4a47);border:1px solid #3fc97a55;position:relative;overflow:hidden}\n.adv::before{content:\"\";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(11,122,69,0.132),transparent 70%);transform:translateX(-100%);animation:shine 4s infinite}\n@keyframes shine{40%,100%{transform:translateX(100%)}}\n.adv .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;color:var(--lime)}\n.badge{background:var(--sun);color:#3a2700;font-weight:800;font-size:13px;padding:5px 12px;border-radius:99px;animation:bump 1.6s infinite}\n.adv p{line-height:1.55;font-weight:600;position:relative}\n.sms{margin-top:14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(11,122,69,0.071);font-weight:700;flex-wrap:wrap}\n.sms .sp{flex:1;min-width:120px}\n.sw{flex:none;position:relative;width:50px;height:28px;border-radius:99px;background:rgba(11,122,69,0.231);cursor:pointer;transition:.3s;border:0}\n.sw::after{content:\"\";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s cubic-bezier(.3,1.5,.5,1)}\n.sw.on{background:linear-gradient(90deg,#19b36b,var(--lime))}.sw.on::after{transform:translateX(22px)}\n.st{width:30px;height:30px;border-radius:50%;border:0;background:rgba(11,122,69,0.187);color:#fff;font:800 18px Nunito;cursor:pointer;transition:.2s}\n.st:hover{background:var(--sky);color:#06210f;transform:scale(1.15)}\n.ring{animation:ring 1s}\n@keyframes ring{20%,60%{transform:rotate(18deg)}40%,80%{transform:rotate(-18deg)}}\n.ct h3{font-size:17px;color:var(--sun)}\n.ct .top{align-items:center}\n.chart{margin-top:10px;border-radius:22px;background:#00000026;border:1px solid rgba(11,122,69,0.110);padding:8px}\n.chart svg{display:block;width:100%;height:auto;overflow:visible}\n.line{fill:none;stroke:var(--tr);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s .2s ease-out forwards;filter:drop-shadow(0 0 6px var(--tr))}\n@keyframes draw{to{stroke-dashoffset:0}}\n.area{opacity:0;animation:fade 1s 1.2s forwards}\n@keyframes fade{to{opacity:1}}\n.dot{fill:var(--bg);stroke:var(--tr);stroke-width:3;cursor:pointer;opacity:0;animation:fade .4s forwards;transition:r .2s}\n.dot:hover{r:9}\n.lbl{fill:var(--mute);font:700 12px Nunito}\n.last{fill:var(--tr);animation:pulse 1.6s infinite}\n@keyframes pulse{50%{opacity:.35}}\n.tip{position:absolute;background:#fff;color:#06210f;padding:6px 10px;border-radius:10px;font-weight:800;font-size:13px;pointer-events:none;opacity:0;transition:.15s;z-index:4;tra <small>Odisha<\/small><\/div>\n<\/div>\n\n<div class=\"two\">\n <section class=\"card\">\n  <h2 class=\"ttl\"><span class=\"n\" style=\"background:var(--sun)\">1<\/span>Farmer identity<\/h2>\n  <label class=\"l\" style=\"margin-top:0\">Full name<\/label>\n  <div class=\"f\"><span>\ud83e\uddd1<\/span><input type=\"text\" id=\"in\" value=\"Ramesh Patel\"><\/div>\n  <label class=\"l\">Mobile number (for SMS weather &amp; price alerts)<\/label>\n  <div class=\"f\"><span>\ud83d\udcf1<\/span><input type=\"tel\" value=\"+91 98452 71023\"><\/div>\n  <div class=\"tg\"><div>\ud83c\udf27\ufe0f Weather alerts<small>Rain and spray-window warnings<\/small><\/div><button class=\"sw on\" aria-label=\"Weather alerts\"><\/button><\/div>\n  <div class=\"tg\"><div>\ud83d\udcb0 Mandi price alerts<small>Daily rate for your crop<\/small><\/div><button class=\"sw on\" aria-label=\"Price alerts\"><\/button><\/div>\n  <div class=\"tg\"><div>\ud83e\udda0 Disease alerts<small>Outbreaks near your village<\/small><\/div><button class=\"sw\" aria-label=\"Disease alerts\"><\/button><\/div>\n <\/section>\n\n <section class=\"card\">\n  <h2 class=\"ttl\"><span class=\"n\" style=\"background:var(--lime)\">2<\/span>Farm land &amp; crop<\/h2>\n  <div class=\"r2\">\n   <div><label class=\"l\" style=\"margin-top:0\">Land size<\/label><div class=\"f\"><span>\ud83d\udccf<\/span><input type=\"number\" id=\"ln\" value=\"3.5\" step=\"0.1\" min=\"0\"><\/div><\/div>\n   <div><label class=\"l\" style=\"margin-top:0\">Unit<\/label><div class=\"f\"><span>\ud83d\uddfa\ufe0f<\/span><select id=\"un\"><option>acres<\/option><option>hectares<\/option><option>bigha<\/option><\/select><\/div><\/div>\n  <\/div>\n  <label class=\"l\">Main crop to monitor<\/label>\n  <div class=\"f\"><span>\ud83c\udf45<\/span><select id=\"cr\"><option>Tomato (Hybrid Shivam)<\/option><option>Tomato (Local)<\/option><option>Potato<\/option><option>Chilli<\/option><\/select><\/div>\n  <label class=\"l\">Current growth stage<\/label>\n  <div class=\"stages\" id=\"stages\"><\/div>\n <\/section>\n<\/div>\n\n<button class=\"save\" id=\"save\">\ud83d\udcbe Save my settings<\/button>\n<\/div>\n\n<button class=\"voice\" id=\"voice\"><i>\ud83c\udf99\ufe0f<\/i><span>Voice assistant<small>AI voice copilot<\/small><\/span><\/button>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)};\nconst AV=[['\ud83e\uddd1\u200d\ud83c\udf3e','#1d7a4a'],['\ud83d\udc69\u200d\ud83c\udf3e','#d2691e'],['\ud83d\udc68\ud83c\udffd\u200d\ud83c\udf3e','#2b6cb0'],['\ud83e\uddd4','#7b3fa0']];\nconst ava=$('ava');\nfunction setAva(e,g,i){ava.textContent=e;ava.style.background=g;ava.classList.remove('pop');void ava.offsetWidth;ava.classList.add('pop');document.querySelectorAll('.pa').forEach((p,j)=>p.classList.toggle('on',j===i))}\nAV.forEach(([e,g],i)=>{const b=document.createElement('button');b.className='pa'+(i?'':' on');b.style.setProperty('--g',g);b.textContent=e;b.onclick=()=>setAva(e,g,i);$('pres').appendChild(b)});\nava.style.background=AV[0][1];\nfunction pic(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ava.innerHTML=`<img src=\"${r.result}\" alt=\"Profile photo\">`;ava.classList.remove('pop');void ava.offsetWidth;ava.classList.add('pop');document.querySelectorAll('.pa').forEach(p=>p.classList.remove('on'));toast('Photo updated \ud83d\udcf8')};r.readAsDataURL(f)}\n$('file').onchange=pic;$('file2').onchange=pic;\nconst ST=[['\ud83c\udf31','Seedling','#7ee08a'],['\ud83c\udf3f','Vegetative','#3fc97a'],['\ud83c\udf38','Flowering','#ff7ab8'],['\ud83c\udf45','Fruiting','#ff7a59'],['\ud83e\uddfa','Harvesting','#ffc533']];\nST.forEach((s,i)=>{const b=document.createElement('button');b.className='st'+(i==2?' on':'');b.style.setProperty('--c',s[2]);b.textContent=s[0]+' '+s[1];\n b.onclick=()=>{document.querySelectorAll('.st').forEac ,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;\nbackground-image:radial-gradient(800px 500px at 0 0,#1d7a4a66,transparent),radial-gradient(700px 500px at 100% 40%,#38c6ff26,transparent),radial-gradient(600px 400px at 30% 100%,#ff7ab822,transparent)}\nh1,h2,h3,.disp{font-family:'Baloo 2',sans-serif}\n.panel{max-width:860px;margin:18px auto;border-radius:30px;overflow:hidden;background:#0d3326;border:1px solid rgba(11,122,69,0.143);box-shadow:0 24px 70px #0e7a4a44;animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}\n@keyframes pop{from{opacity:0;transform:scale(.94) translateY(20px)}}\n.head{position:relative;padding:26px 28px 30px;background:linear-gradient(120deg,#0b7a55,#0f4a33 55%,#2b1f0b);overflow:hidden}\n.head::after{content:\"\";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--sun);filter:blur(70px);opacity:.35;right:-60px;top:-110px;animation:drift 8s ease-in-out infinite}\n@keyframes drift{50%{transform:translate(-50px,40px) scale(1.2)}}\n.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(11,122,69,0.170);padding:5px 12px;border-radius:999px;font-weight:800;font-size:12px;color:var(--lime)}\n.pill i{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:blink 1.4s infinite}\n@keyframes blink{50%{opacity:.25;transform:scale(.7)}}\n.head h1{font-size:clamp(26px,5vw,36px);margin:10px 0 6px;position:relative;z-index:1}\n.head p{color:#4a6b59;max-width:52ch;line-height:1.5;position:relative;z-index:1}\n.x{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(11,122,69,0.187);color:#fff;font-size:18px;cursor:pointer;z-index:2;transition:.25s}\n.x:hover{transform:rotate(90deg);background:var(--red)}\n.body{padding:22px}\n.mic-box{position:relative;text-align:center;padding:30px 18px 24px;border-radius:26px;background:linear-gradient(160deg,rgba(11,122,69,0.088),rgba(11,122,69,0.027));border:1px solid rgba(11,122,69,0.154)}\n.mic-wrap{position:relative;width:110px;height:110px;margin:0 auto 14px}\n.mic{position:relative;z-index:2;width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;font-size:42px;color:#06210f;background:radial-gradient(circle at 30% 25%,#e6ff8a,var(--lime) 45%,#19b36b);box-shadow:0 10px 34px #19b36baa;animation:bob 3s ease-in-out infinite;transition:.2s}\n.mic:hover{transform:scale(1.07)}\n@keyframes bob{50%{transform:translateY(-6px)}}\n.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--lime);animation:ripple 2.4s infinite}\n.ring:nth-child(2){animation-delay:.8s}.ring:nth-child(3){animation-delay:1.6s}\n@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}\n.listening .mic{background:radial-gradient(circle at 30% 25%,#c92a2a,var(--red) 50%,#c92a4b);box-shadow:0 10px 34px #e5484daa;animation:beat .7s infinite}\n.listening .ring{border-color:var(--red);animation-duration:1.2s}\n@keyframes beat{50%{transform:scale(1.1)}}\n.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:30px;margin-bottom:6px;opacity:0;transition:.3s}\n.listening .wave{opacity:1}\n.wave i{width:5px;border-radius:3px;background:linear-gradient(var(--sky),var(--pink));height:6px;animation:eq .8s ease-in-out infinite}\n@keyframes eq{50%{height:28px}}\n.mic-box h2{font-size:24px}\n.mic-box p{color:var(--mute);margin-top:2px}\n.up{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:999px;border:1.5px dashed var(--sky);color:var(--sky);font-weight:800;cursor:pointer;transition:.2s}\n.up:hover{background:#38c6ff22;transform:translateY(-2px)}\n.sub{margin:24px 2px 12px;font-weight:800;color:var(--sun);display:flex;gap:8px;align-items:center;font-size:14px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}\n.s{text-align:left;border:0;color:var(--ink);font-family:inherit;cursor:pointer;border-radius:20px;padding:16px;background:var(--card);border:1px solid rgba(11,122,69,0.121);border-left:6px solid var(--a);transition:.25s;animation:rise .6s both;position:relative;overflow:hidden}\n.s:nth-child(2){animation-delay:.1s}.s:nth-child(3){animation-delay:.2s}.s:nth-child(4){animation-delay:.3s}\n@keyframes rise{from{opacity:0;transform:translateY(22px)}}\n.s::before{content:\"\";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(11,122,69,0.110),transparent);transform:translateX(-100%);transition:.6s}\n.s:hover{transform:translateY(-5px);box-shadow:0 14px 30px -12px var(--a)}\n.s:hover::before{transform:translateX(100%)}\n.s.on{outline:2px solid var(--a)}\n.s .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}\n.s b{font:700 17px 'Baloo 2';line-height:1.2}\n.tag{flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--a) 28%,transparent);color:var(--a)}\n.s span.q{display:block;color:#33573f;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}\n.res{display:none;margin-top:22px;border-radius:24px;padding:20px;background:linear-gradient(150deg,#12394a,#0d3326);border:1px solid rgba(11,122,69,0.187)}\n.res.show{display:block;animation:pop .5s both}\n.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}\n.step{padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;background:rgba(11,122,69,0.110);color:var(--mute);transition:.4s}\n.step.done{background:var(--lime);color:#06210f}\n.step.now{background:var(--sun);color:#3a2700;animation:blink 1s infinite}\n.tr{font-style:italic;color:#254a37;line-height:1.55;padding:12px 14px;border-radius:14px;background:rgba(11,122,69,0.071);border-left:4px solid var(--sky);min-height:48px}\n.risk{margin:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.risk .tag{font-size:13px;padding:6px 14px}\n.meter{flex:1;min-width:140px;height:10px;border-radius:99px;background:rgba(11,122,69,0.132);overflow:hidden}\n.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--lime),var(--sun),var(--red));transition:width 1.2s cubic-bezier(.2,.9,.3,1)}\n.acts{display:grid;gap:10px;list-style:none;padding:0}\n.acts li{display:flex;gap:10px;line-height:1.5;padding:12px;border-radius:14px;background:rgba(11,122,69,0.071);opacity:0;transform:translateX(-16px);animation:slide .5s forwards}\n@keyframes slide{to{opacity:1;transform:none}}\n.acts em{font-style:normal;font-size:20px}\n.fine{margin-top:12px;font-size:12.5px;color:#7a4f00;background:#ffc53318;border:1px dashed #ffc53388;padding:10px 12px;border-radius:12px;line-height:1.5}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}\n\n/* ===== Light theme: green & white ===== */\nhtml{color-scheme:light}\nbody{background:#f3faf5;background-image:radial-gradient(800px 480px at 8% -8%,#c8f0d9cc,transparent),radial-gradient(700px 460px at 100% 18%,#d9f3e4aa,transparent),radial-gradient(600px 400px at 50% 100%,#fff6d488,transparent)}\n:focus-visible{outline:3px solid #0e9f5c;outline-offset:2px}\n.card,.panel{background:#fff;border:1px solid #d3eadb;box-shadow:0 12px 32px -18px #0e7a4a66}\n.hero,.intro,.head,.sec,.res{background:linear-gradient(135deg,#e3f7ea,#fff 78%);border:1px solid #cfe8d8;color:var(--ink);box-shadow:0 14px 36px -20px #0e7a4a77}\n.head p,.intro p,.hero p{color:#4a6b59}\n.pill{background:#d6f3e2;color:#0b7a45}\n.hero h1 span{color:#0b8a4d}\n.sub,.ct h3{color:#a65f00}\n.adv{background:linear-gradient(135deg,#0e9f5c,#14b86a);border:0;color:#fff}\n.adv .h,.adv p{color:#fff}\n.x{background:#e3f3e9;color:var(--ink)}.x:hover{background:var(--red);color:#fff}\n.sw{background:#cfe3d6}.sw::after{box-shadow:0 1px 3px #0003}.sw.on{background:linear-gradient(90deg,#0e9f5c,#2fbf71)}\n.view{background:radial-gradient(circle at 50% 40%,#f1fbf5,#bfe6cd);border-color:#cfe8d8}\n.view .chip,.view .cap{color:#fff}\n.tag,.b{color:color-mix(in srgb,var(--a,var(--c,#0b7a45)) 55%,#000)}\n.c a,.m small{color:color-mix(in srgb,var(--a,var(--c)) 55%,#000)}\n.voice{background:linear-gradient(90deg,#0e9f5c,#2fbf71);color:#fff;box-shadow:0 10px 26px -6px #0e9f5c99}\n.voice i{background:#fff}.voice i::after{border-color:#2fbf71}\n.sp{background:#e3f3e9;color:#0b7a45}\nselect,textarea,input[type=text],input[type=tel],input[type=number]{background:#fff;border:1.5px solid #cfe3d6;color:var(--ink)}\n.chart{background:#f7fcf9;border:1px solid #d3eadb}\n.tip{background:#12392a;color:#fff;box-shadow:0 6px 16px #0003}\n.toast{background:#12392a;color:#fff}\n.ticker,.mic-box{background:#fff;border:1px solid #d3eadb}\n.intro .chips .chip{background:#fff;color:var(--ink)}\n.intro .chips .chip.on{background:var(--c);color:#06210f}\n.sms .st{background:#e3f3e9;color:#12392a}\n.adv::before{background:linear-gradient(100deg,transparent 30%,#ffffff44,transparent 70%)}\nnav{display:none!important}<\/style>\n<\/head>\n<body>\n<main class=\"panel\">\n <div class=\"head\">\n  <button class=\"x\" aria-label=\"Close\" onclick=\"parent.postMessage({go:'weather'},'*')\">\u2715<\/button>\n  <span class=\"pill\"><i><\/i>AI voice copilot<\/span>\n  <h1>\ud83c\udf3e Agricultural Voice Assistant<\/h1>\n  <p>Speak your crop questions in your own voice. Our AI writes down what you said, spots the risks, and gives you clear farming advice.<\/p>\n <\/div>\n <div class=\"body\">\n  <div class=\"mic-box\" id=\"box\">\n   <div class=\"mic-wrap\"><span class=\"ring\"><\/span><span class=\"ring\"><\/span><span class=\"ring\"><\/span><button class=\"mic\" id=\"mic\" aria-label=\"Tap to speak\">\ud83c\udf99\ufe0f<\/button><\/div>\n   <div class=\"wave\" id=\"wave\"><\/div>\n   <h2 id=\"mt\">Tap the microphone to speak<\/h2>\n   <p id=\"ms\">Speak in any language: English, Hindi, Telugu, Marathi, Spanish\u2026<\/p>\n   <label class=\"up\">\u2b06\ufe0f Upload audio file (.mp3, .wav, .webm)<input type=\"file\" id=\"file\" accept=\"audio/*\" hidden><\/label>\n  <\/div>\n\n  <div class=\"sub\">\ud83c\udfa7 Try a sample question<\/div>\n  <div class=\"grid\" id=\"grid\"><\/div>\n\n  <section class=\"res\" id=\"res\">\n   <div class=\"steps\"><span class=\"step\" id=\"s1\">1 Transcribing<\/span><span class=\"step\" id=\"s2\">2 Finding risks<\/span><span class=\"step\" id=\"s3\">3 Advice ready<\/span><\/div>\n   <div class=\"tr\" id=\"tr\"><\/div>\n   <div class=\"risk\"><span class=\"tag\" id=\"rt\"><\/span><div class=\"meter\"><i id=\"rm\"><\/i><\/div><b id=\"rp\"><\/b><\/div>\n   <ul class=\"acts\" id=\"acts\"><\/ul>\n   <div class=\"fine\">Sample advice only. Please confirm with your local Krishi Vigyan Kendra (KVK) or extension officer before buying or applying any chemicals.<\/div>\n  <\/section>\n <\/div>\n<\/main>\n\n<script>\nconst S=[\n{a:'#ff9f43',ic:'\ud83c\udf42',t:'Tomato leaf spots & yellowing',tag:'Disease & treatment',q:'Namaste, my flowering tomato crop has brown circular spots with target rings on lower leaves. What should I do?',r:'Early blight likely',p:72,acts:['\u2702\ufe0f|Remove and bag the infected lower leaves. Do not compost them.','\ud83d\udca7|Water at the base of the plant, not over the leaves, and do it in the morning.','\ud83c\udf2c\ufe0f|Space plants and stake them so air can move through the canopy.','\ud83e\uddd1\u200d\ud83c\udf3e|Show a leaf to your KVK before you choose a fungicide.']},\n{a:'#e5484d',ic:'\ud83d\udeab',t:'Spray window & high humidity',tag:'Weather & spray safety',q:'Humidity is around 80% today in Sambalpur and rain is expected. Is it safe to spray bio-fungicide right now?',r:'Do not spray now',p:84,acts:['\u23f3|Wait. Rain can wash the spray off and waste your money.','\ud83d\udd50|Look for a dry window of at least 4\u20136 hours, ideally early morning with light wind.','\ud83d\udca8|Skip spraying if gusts are strong, because the spray will drift.','\ud83d\udcf2|Check the 48-hour forecast again tomorrow morning.']},\n{a:'#38c6ff',ic:'\ud83e\uddfa',t:'Mandi price & harvest timing',tag:'Mandi & timing',q:'What is the current tomato mandi price in Sambalpur APMC, and should I harvest my breaker stage fruit?',r:'Hold 3\u20135 days',p:35,acts:['\ud83d\udcc8|Sample rate shown in the app: \u20b92450 per quintal. Check the live mandi page before you decide.','\ud83c\udf45|Breaker-stage fruit ripens off the plant, so pick it early only if the market is far or rain is coming.','\ud83d\ude9a|Pick in the cool morning and sort by ripeness before transport.','\ud83e\udd1d|Ask a nearby farmer group about today\\'s arrivals.']},\n{a:'#ff7ab8',ic:'\ud83c\udf38',t:'Blossom drop & nutrients',tag:'Fertigation & nutrients',q:'My tomato plants are in full flowering stage but many blossoms are dropping off. What fertilizer or spray should I use?',r:'Stress or nutrient gap',p:55,acts:['\ud83c\udf21\ufe0f|Hot days above 35\u00b0C or cold nights often cause blossom drop. Shade or mulch can help.','\ud83d\udca6|Keep watering steady. Swings between dry and wet soil stress the flowers.','\ud83e\uddea|Calcium and boron gaps can play a part. A soil test tells you what is truly missing.','\u2696\ufe0f|Avoid heavy nitrogen now. It gives leaves, not fruit.']}];\nconst $=id=>document.getElementById(id);\nS.forEach((s,i)=>{const b=document.createElement('button');b.className='s';b.style.setProperty('--a',s.a);\n b.innerHTML=`<div class=\"t\"><b>${s.ic} ${s.t}<\/b><span class=\"tag\">${s.tag}<\/span><\/div><span class=\"q\">\u201c${s.q}\u201d<\/span>`;\n b.onclick=()=>run(i);$('grid').appendChild(b)});\nfor(let i=0;i<22;i++){const e=document.createElement('i');e.style.animationDelay=(i*.07)+'s';e.style.animationDuration=(.5+Math.random()*.6)+'s';$('wave').appendChild(e)}\nlet timers=[],listening=false;\nconst later=(f,ms)=>timers.push(setTimeout(f,ms));\nfunction clr(){timers.forEach(clearTimeout);timers=[]}\nfunction reset(){clr();listening=false;$('box').classList.remove('listening');$('res').classList.remove('show');$('mt').textContent='Tap the microphone to speak';document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'))}\nfunction run(i,heard){clr();const s=S[i];\n document.querySelectorAll('.s').forEach((x,j)=>x.classList.toggle('on',j===i));\n const r=$('res');r.classList.remove('show');void r.offsetWidth;r.classList.add('show');\n ['s1','s2','s3'].forEach(id=>$(id).className='step');$('tr').textContent='';$('acts').innerHTML='';$('rm').style.width='0';$('rt').textContent='\u2026';$('rp').textContent='';\n $('s1').classList.add('now');\n const txt=heard||s.q;let k=0;\n const typ=setInterval(()=>{$('tr').textContent='\u201c'+txt.slice(0,++k)+(k<txt.length?'':'\u201d');if(k>=txt.length)clearInterval(typ)},18);timers.push(typ);\n later(()=>{$('s1').className='step done';$('s2').classList.add('now')},txt.length*18+300);\n later(()=>{$('s2').className='step done';$('s3').className='step now';\n  $('rt').textContent=s.r;$('rt').style.cssText=`background:color-mix(in srgb,${s.a} 28%,transparent);color:${s.a}`;$('rm').style.width=s.p+'%';$('rp').textContent=s.p+'/100';\n  s.acts.forEach((a,n)=>{const [e,t]=a.split('|');const li=document.createElement('li');li.style.animationDelay=(n*.25)+'s';li.innerHTML=`<em>${e}<\/em><span>${t}<\/span>`;$('acts').appendChild(li)});\n  later(()=>$('s3').className='step done',900);\n  r.scrollIntoView({behavior:'smooth',block:'nearest'})},txt.length*18+1400);\n r.scrollIntoView({behavior:'smooth',block:'nearest'})}\n$('mic').onclick=()=>{if(listening){reset();return}\n listening=true;$('box').classList.add('listening');$('mt').textContent='Listening\u2026 tap again to stop';\n later(()=>{$('box').classList.remove('listening');listening=false;$('mt').textContent='Got it! Working on your answer\u2026';run(0)},3500)};\n$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;$('mt').textContent='Uploaded: '+f.name;run(0,'Audio file received. This demo shows a sample answer instead of reading your recording.')};\n<\/script>\n<\/body>\n<\/html>\n"};
const fr=document.getElementById('fr'),F={};
function go(k){
 if(!P[k])k='weather';
 document.querySelectorAll('#nav a.tab').forEach(a=>{const on=a.getAttribute('href')==='#'+k;on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');if(on)a.scrollIntoView({inline:'center',block:'nearest'})});
 Object.values(F).forEach(f=>f.classList.remove('on'));
 if(!F[k]){const f=document.createElement('iframe');f.title=k;document.getElementById('ld').classList.remove('h');f.onload=()=>document.getElementById('ld').classList.add('h');f.srcdoc=P[k];fr.appendChild(f);F[k]=f}
 else document.getElementById('ld').classList.add('h');
 F[k].classList.add('on');document.title='KisanMitra AI';
}

go(location.hash.slice(1)||'weather');
